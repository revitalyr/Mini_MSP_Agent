[package]
name = "mini-msp-tests"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "test-runner"
path = "test_runner.rs"

[[test]]
name = "broker_unit_tests"
path = "broker_unit_tests.rs"

[[test]]
name = "broker_integration_tests"
path = "broker_integration_tests.rs"

[[test]]
name = "broker_module_tests"
path = "broker_module_tests.rs"

[[test]]
name = "plugin_tests"
path = "plugin_tests.rs"

[dependencies]
mini_msp_agent = { path = "../agent" }
mini_msp_shared = { path = "../shared" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = { version = "0.4" }
futures-util = "0.3"
async-nats = "0.35"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
testcontainers = "0.15"
