version: "3.8"

services:
  server:
    build: 
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
    networks:
      - msp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    environment:
      - RUST_LOG=info
    volumes:
      - ./configs/config.toml:/app/config.toml
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    depends_on:
      server:
        condition: service_healthy
    networks:
      - msp-network
    command: ["--config", "/app/config.toml"]

networks:
  msp-network:
    driver: bridge
