services:
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"   # клиенты
      - "8222:8222"   # HTTP мониторинг
    command: ["--jetstream"]  # включить персистентные очереди
    networks:
      - msp-network

  server:
    build: 
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - RUST_LOG=debug
      - BROKER_URL=nats://nats:4222
    networks:
      - msp-network
    depends_on:
      - nats
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    environment:
      - RUST_LOG=debug
      - BROKER_URL=nats://nats:4222
    volumes:
      - ./configs/config.toml:/app/config.toml
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ./plugins:/app/plugins:ro
    depends_on:
      server:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - msp-network
    command: ["--config", "/app/config.toml"]

  web-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - RUST_LOG=info
      - NATS_URL=nats://nats:4222
    networks:
      - msp-network
    depends_on:
      - nats

  web-frontend:
    build:
      context: ./web-interface
      dockerfile: Dockerfile
    ports:
      - "80:80"
    networks:
      - msp-network
    depends_on:
      - web-backend

networks:
  msp-network:
    driver: bridge
