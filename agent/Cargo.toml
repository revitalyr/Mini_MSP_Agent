[workspace]
members = [
    "core",
    "core/plugins/system_plugin", 
    "core/plugins/file_plugin",
    "core/plugins/network_plugin",
    "core/shared"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
tracing-appender = "0.2"
async-nats = "0.35"
uuid = { version = "1.6", features = ["v4", "serde", "std"] }
sysinfo = "0.30"
reqwest = { version = "0.11", features = ["json"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
toml = "0.8"
clap = { version = "4.4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
gethostname = "0.4"
nix = "0.27"
rand = { version = "0.8", features = ["std"] }
async-trait = "0.1"

[package]
name = "mini_msp_agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "agent"
path = "core/src/main.rs"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Reduce codegen units
strip = true        # Strip debug symbols
panic = "abort"     # Abort instead of unwind

[dependencies]
mini_msp_core = { path = "core" }

[dev-dependencies]
tokio-test = "0.4"

[[test]]
name = "agent_broker_unit_tests"
path = "tests/broker_unit_tests.rs"
