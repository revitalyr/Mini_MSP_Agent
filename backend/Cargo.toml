[package]
name = "mini-msp-web-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "serve-dir"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-nats = "0.31"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
anyhow = "1.0"
futures-util = "0.3"
mini_msp_shared = { path = "../shared" }
