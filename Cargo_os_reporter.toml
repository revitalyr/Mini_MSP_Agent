[package]
name = "mini_msp_os_reporter"
version = "0.1.0"
edition = "2021"
authors = ["Mini MSP Agent Team"]
description = "Comprehensive OS information reporter for Mini MSP Agent"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "os_reporter"
path = "src/main.rs"

[lib]
name = "os_reporter"
path = "src/os_reporter.rs"
