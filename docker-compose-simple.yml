services:
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--jetstream"]
    networks:
      - msp-network

  server:
    image: debian:bookworm-slim
    ports:
      - "8081:8081"
    volumes:
      - ./target/release/server:/usr/local/bin/server
      - ./server/static:/app/static
    command: ["/usr/local/bin/server"]
    networks:
      - msp-network
    depends_on:
      - nats

  agent:
    image: debian:bookworm-slim
    volumes:
      - ./target/release/agent:/usr/local/bin/agent
      - ./configs/config.toml:/app/config.toml
      - ./plugins:/app/plugins
    command: ["/usr/local/bin/agent", "--config", "/app/config.toml"]
    networks:
      - msp-network
    depends_on:
      - nats
      - server

networks:
  msp-network:
    driver: bridge
