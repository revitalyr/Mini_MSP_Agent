[package]
name = "mini-msp-agent-standalone"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "agent"
path = "main.rs"

[dependencies]
mini_msp_shared = { path = "../../shared" }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
tracing-appender = "0.2"
async-nats = "0.35"
uuid = { version = "1.6", features = ["v4", "serde", "std"] }
sysinfo = "0.30"
reqwest = { version = "0.11", features = ["json"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
toml = "0.8"
clap = { version = "4.4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
gethostname = "0.4"
nix = "0.27"
rand = { version = "0.8", features = ["std"] }
async-trait = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
