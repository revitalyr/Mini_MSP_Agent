[package]
name = "qt_client"
version = "0.1.0"
edition = "2021"

[lib]
name = "qt_client"
crate-type = ["cdylib"]

[[bin]]
name = "qt_client"
path = "src/main.cpp"

[dependencies]
# Qt dependencies
qt-core = "0.5"
qt-widgets = "0.5"
qt-gui = "0.5"

# Shared dependencies
shared = { path = "../../shared" }

# NATS client
async-nats = "0.35"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
qt-build-tools = "0.5"
cc = "1.0"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[features]
default = ["qt6"]
qt5 = ["qt-core/qt5", "qt-widgets/qt5", "qt-gui/qt5"]
qt6 = ["qt-core/qt6", "qt-widgets/qt6", "qt-gui/qt6"]
