[package]
name = "qt_client"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "qt_client"
path = "src/main.cpp"

[dependencies]
# Shared dependencies
mini_msp_shared = { path = "../../shared" }

# Basic dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


