[package]
name = "mini_msp_server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/main.rs"

[features]
default = []
# Enable Boost.DLL C++ plugin support (requires C++ libraries to be built)
boost_dll = []

[lints.rust]
# Allow the boost_dll cfg condition that is set by build.rs
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("boost_dll"))'] }

[dependencies]
mini_msp_shared = { path = "../../shared" }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
async-nats = { workspace = true }
uuid = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["fs", "cors", "trace"] }
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
clap = { workspace = true }
jsonwebtoken = "10.3.0"
chrono = "0.4"
toml = { workspace = true }
libloading = "0.8"
parking_lot = "0.12"

# OpenAPI generation
utoipa = { version = "5.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "8.0", features = ["axum"] }

[target.'cfg(windows)'.dependencies]
rfd = "0.15"   # native file dialog, кроссплатформенный
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
] }

[target.'cfg(unix)'.dependencies]
rfd = "0.15"

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
axum = { workspace = true }
tokio-test = "0.4"
