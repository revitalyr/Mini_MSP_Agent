# NATS Server Configuration
# Proper configuration to avoid port conflicts

# Network configuration
listen: 127.0.0.1:4222
host: 127.0.0.1
port: 4222

# Monitoring configuration (disabled to avoid conflicts)
# monitor_port: 8222
# http: 8222

# Authorization (disabled for demo)
# authorization: ""

# JetStream configuration (commented out to avoid parsing issues)
# jetstream {
#     store_dir: ./data/jetstream
#     max_memory_store: 1GB
# }

# Logging configuration
log_file: ./logs/nats-server.log
logtime: true
debug: false
trace: false

# Connection limits
max_connections: 1000
max_payload: 1MB

