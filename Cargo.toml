[workspace]
members = [
    "apps/agent",
    # "apps/agent_standalone", # TODO: Fix struct mismatches before re-enabling
    "apps/server", 
    "shared"
]
exclude = [
    "tests",
    "target"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
async-nats = "0.35"
uuid = { version = "1.0", features = ["v4", "serde"] }
sysinfo = "0.30"
reqwest = { version = "0.11", features = ["json"] }
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
futures-util = "0.3"
toml = "0.8"
clap = { version = "4.0", features = ["derive"] }
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
chrono = { version = "0.4", features = ["serde"] }
gethostname = "0.4"
tempfile = "3.8"
nix = "0.27"
rand = { version = "0.8", features = ["std"] }
async-trait = "0.1"
loguru = "0.1"
testcontainers = "0.15"
tokio-test = "0.4"
zstd = "0.13"
libloading = "0.8"

[profile.dev]
opt-level = 1          # Базовая оптимизация для dev
debug = true
overflow-checks = false
lto = false
panic = "unwind"
incremental = true
codegen-units = 256    # Параллельная компиляция

[profile.release]
opt-level = 3          # Максимальная оптимизация
debug = false
overflow-checks = false
lto = "thin"         # Link-time optimization
panic = "abort"       # Уменьшает размер бинарника
incremental = false
codegen-units = 1      # Максимальная оптимизация линковки
strip = true
